name: CI

on:
  workflow_dispatch:
  push:
    branches:
     - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: write
      pull-requests: write
    uses: fastify/workflows/.github/workflows/plugins-ci.yml@v7
    with:
      node-versions: '["24", "26"]'
      lint: true
